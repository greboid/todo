name: Test and Build

enable-openid-connect: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/node-setup@master
        with:
          working-dir: web
      - name: Install SPA dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build SPA
        working-directory: web
        run: pnpm build
      - name: Test SPA
        working-directory: web
        run: pnpm test
      - name: Test API Spec
        run: npx --yes @redocly/cli@2 lint --extends recommended-strict --format=github-actions internal/api/openapi.yaml
      - uses: actions/toolkit/go-vet@master
      - uses: actions/toolkit/go-test@master
  container:
    needs: test
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:b9293ba2-f8a7-439e-a788-a9107b7e3ea4
          ghcr: ${{ secrets.GHCR_TOKEN }}
      - uses: actions/toolkit/docker-push@master
        with:
          file: Containerfile
          ghcr: true
