openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: |
    JSON API for a single-binary todo app: todos grouped into boards, with
    subtasks (parent/child), labels, ordering, Todoist-style due dates and
    recurrence, and free-text schedule parsing.

    The same binary also serves a Svelte SPA for everything under `/`; this
    document describes only the `/api` surface.

    All responses use JSON. Error bodies have the shape `{"error": "<message>"}`.
    List endpoints never return `null` for an array — an empty collection is
    serialized as `[]`. Request bodies are capped at 1 MiB.

    Authentication is optional: when the server is started with the
    `-api-key` flag, requests must authenticate (see ApiKeyAuth); without the
    flag the API is open. Browsers are handled specially: loading the SPA
    document mints a short-lived `todo_session` cookie (HttpOnly, sliding
    expiry, re-issued on every authenticated request) that is accepted in
    place of the key, so the UI works without ever seeing it.
servers:
  - url: /
    description: Relative to the server host (default listen address :8080).
tags:
  - name: Todos
    description: Create, read, update, delete, move, and complete todos.
  - name: Boards
    description: Top-level groupings of todos. At least one board must exist.
  - name: Labels
    description: Predefined label set plus labels currently in use.
  - name: Priorities
    description: Predefined priority set plus priorities currently in use. A todo carries at most one priority.
  - name: Saved searches
    description: Named filter queries that can be re-applied from the toolbar.
  - name: Schedule
    description: Free-text due-date/recurrence parsing.
  - name: Events
    description: Server-sent events stream for live sync across clients.

security:
  - ApiKeyAuth: []

paths:
  /api/todos:
    get:
      tags: [Todos]
      operationId: listTodos
      summary: List todos
      description: >
        Returns todos. Without `boardId`, every todo across all boards is
        returned. Provide `boardId` to scope to a single board.

        With `filter`, matching is performed server-side (see the filter grammar
        in internal/filter): the response contains only matching todos plus the
        ancestors that keep the tree connected. The same query accepts
        `sort:<field>` terms that reorder the matching todos within each
        sibling group. `today` (YYYY-MM-DD) anchors the date presets
        (today/tomorrow/week) to the user's local date. A malformed filter
        returns 400.
      parameters:
        - $ref: "#/components/parameters/BoardIdQuery"
        - $ref: "#/components/parameters/FilterQuery"
        - $ref: "#/components/parameters/TodayQuery"
      responses:
        "200":
          description: Todo list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodo" }
      responses:
        "201":
          description: Created todo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/todos/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Todos]
      operationId: getTodo
      summary: Get a todo
      responses:
        "200":
          description: The todo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Todos]
      operationId: updateTodo
      summary: Update a todo (partial)
      description: >
        Partial update. Omitted fields are left unchanged. The `parentId`,
        `dueDate`, and `recurrence` fields each support a three-way
        distinction — see the request schema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTodo" }
      responses:
        "200":
          description: Updated todo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Delete a todo
      responses:
        "204": { description: Deleted. No content. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/todos/{id}/move:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Todos]
      operationId: moveTodo
      summary: Move a todo (reparent, reorder, and/or change board)
      description: >
        Reparent and/or reposition a todo within its sibling group. Moving under
        a parent on another board re-scopes the todo to that parent's board.
        An explicit `boardId` moves the todo — with its whole subtree, nesting
        kept — to that board as a root todo; a `parentId` value takes
        precedence (the subtask inherits the parent's board). Self-parenting
        and cycles are rejected (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveTodo" }
      responses:
        "200":
          description: Moved todo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/todos/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Todos]
      operationId: completeTodo
      summary: Mark a todo complete or incomplete
      description: >
        Completing cascades to all descendants and, for a recurring todo,
        spawns a new incomplete instance with the due date advanced (the
        completed original stays in place). The whole board tree is returned
        so the client can re-sync cascaded state. Un-completing does not spawn.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteTodo" }
      responses:
        "200":
          description: The toggled todo plus the full board tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/boards:
    get:
      tags: [Boards]
      operationId: listBoards
      summary: List boards
      responses:
        "200":
          description: Board list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
    post:
      tags: [Boards]
      operationId: createBoard
      summary: Create a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoard" }
      responses:
        "201":
          description: Created board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/boards/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Boards]
      operationId: getBoard
      summary: Get a board
      responses:
        "200":
          description: The board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Boards]
      operationId: updateBoard
      summary: Rename or reorder a board (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoard" }
      responses:
        "200":
          description: Updated board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Boards]
      operationId: deleteBoard
      summary: Delete a board
      description: >
        Deleting the last remaining board is rejected (409). The app requires
        at least one board to exist.
      responses:
        "204": { description: Deleted. No content. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/saved-searches:
    get:
      tags: [Saved searches]
      operationId: listSavedSearches
      summary: List saved searches
      responses:
        "200":
          description: Saved search list, in creation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedSearch" }
    post:
      tags: [Saved searches]
      operationId: createSavedSearch
      summary: Save a filter query under a name
      description: The query must parse with the filter grammar (as GET /api/todos?filter= does).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSavedSearch" }
      responses:
        "201":
          description: Created saved search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/saved-searches/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    delete:
      tags: [Saved searches]
      operationId: deleteSavedSearch
      summary: Delete a saved search
      responses:
        "204": { description: Deleted. No content. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/labels:
    get:
      tags: [Labels]
      operationId: listLabels
      summary: List labels
      description: >
        The merged, de-duplicated, sorted set of predefined labels and labels
        currently in use across todos. Each label carries its colour (a hex
        string, empty when no user-defined colour is set).
      responses:
        "200":
          description: Label list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }

  /api/labels/{name}:
    parameters:
      - $ref: "#/components/parameters/LabelNamePath"
    put:
      tags: [Labels]
      operationId: updateLabel
      summary: Set a label's colour
      description: >
        Sets the user-defined colour for a label. Colour is a hex string
        (e.g. "#ef4444"). An empty string clears the colour so the label
        reverts to its auto-assigned palette colour. The label is created
        if it does not yet exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLabel" }
      responses:
        "200":
          description: Updated label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Labels]
      operationId: deleteLabel
      summary: Delete a label
      description: >
        Removes the label everywhere: detached from every todo, its colour
        row deleted, and any predefined entry removed. Matching is
        case-insensitive.
      responses:
        "204": { description: Deleted. No content. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/labels/predefined:
    post:
      tags: [Labels]
      operationId: addPredefinedLabel
      summary: Add a predefined label
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabel" }
      responses:
        "201":
          description: Added label.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelName" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/labels/predefined/{name}:
    parameters:
      - $ref: "#/components/parameters/LabelNamePath"
    delete:
      tags: [Labels]
      operationId: removePredefinedLabel
      summary: Remove a predefined label
      responses:
        "204": { description: Removed. No content. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/priorities:
    get:
      tags: [Priorities]
      operationId: listPriorities
      summary: List priorities
      description: >
        The merged, de-duplicated set of predefined priorities and priorities
        currently in use across todos, ordered by the user-defined position
        (predefined first, ad-hoc last). Each priority carries its colour (a
        hex string, empty when no user-defined colour is set) and its position
        (absent for ad-hoc priorities without an explicit order).
      responses:
        "200":
          description: Priority list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Priority" }

  /api/priorities/{name}:
    parameters:
      - $ref: "#/components/parameters/LabelNamePath"
    put:
      tags: [Priorities]
      operationId: updatePriority
      summary: Set a priority's colour
      description: >
        Sets the user-defined colour for a priority. Colour is a hex string
        (e.g. "#ef4444"). An empty string clears the colour so the priority
        reverts to its auto-assigned palette colour. The priority is created
        if it does not yet exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePriority" }
      responses:
        "200":
          description: Updated priority.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Priority" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/priorities/predefined:
    post:
      tags: [Priorities]
      operationId: addPredefinedPriority
      summary: Add a predefined priority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePriority" }
      responses:
        "201":
          description: Added priority.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriorityName" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/priorities/reorder:
    post:
      tags: [Priorities]
      operationId: reorderPriorities
      summary: Reorder priorities
      description: >
        Sets the user-defined ordering of predefined priorities. The `names`
        array is the desired order (index 0 = first/highest). Names not in the
        predefined set are ignored. Returns the full, reordered priority list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Reordered priority list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Priority" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/priorities/predefined/{name}:
    parameters:
      - $ref: "#/components/parameters/LabelNamePath"
    delete:
      tags: [Priorities]
      operationId: removePredefinedPriority
      summary: Remove a predefined priority
      responses:
        "204": { description: Removed. No content. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/schedule/parse:
    post:
      tags: [Schedule]
      operationId: parseSchedule
      summary: Parse free-text due date / recurrence
      description: >
        Turns a single free-text string (e.g. `tomorrow`, `aug 15`,
        `every 2 weeks on mon, wed`, `every month on the 15th starting sep 1
        ending dec 31`) into a structured due date and recurrence. Send the
        client's local `today` (YYYY-MM-DD) so relative dates resolve from the
        user's perspective. Times are out of scope (date-only) and parse to an
        error. Always returns 200: `ok=false` carries an `error` string for live
        typing feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleParseRequest" }
      responses:
        "200":
          description: Parse result (success or failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleParseResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/schedule/extract:
    post:
      tags: [Schedule]
      operationId: extractSchedule
      summary: Split quick-add text into title and optional schedule
      description: >
        Splits a quick-add string into a title, any `#label` tags, an optional
        `@priority`, and an optional trailing due date / recurrence. `#label`
        tokens and `@priority` tokens (single words) are pulled out; the rest is
        split so the schedule is the longest trailing run that parses (e.g.
        `Buy milk #errands @high tomorrow` → title "Buy milk", label "errands",
        priority "high", due tomorrow; `Pay rent every month on the 1st` → title
        "Pay rent", monthly recurrence). Send the client's local `today`
        (YYYY-MM-DD) so relative dates resolve from the user's perspective.
        Always returns 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleParseRequest" }
      responses:
        "200":
          description: Extraction result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleExtractResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Server-sent events stream of mutation pokes
      description: >
        Opens a `text/event-stream` that emits an `event: sync` message after
        every successful mutation by any client (todo/board/label/priority/saved-search
        create, update, delete, move, or complete), plus an `event: ping`
        heartbeat every ~20s so clients (and proxies) can tell a live
        connection from a silently-dead one. Events carry no data — the
        expected client reaction to `sync` is to re-fetch whatever view it is
        showing (`ping` is liveness only). The schedule parse/extract
        endpoints never emit events. The stream ends when the client
        disconnects; browsers should reconnect (the server advertises a
        3s retry interval).
      responses:
        "200":
          description: "SSE stream (`event: sync` pokes; `event: ping` heartbeats)."
          content:
            text/event-stream:
              schema: { type: string }

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource identifier (path parameter).
      schema: { type: integer, format: int64 }
    BoardIdQuery:
      name: boardId
      in: query
      required: false
      description: Scope to a single board. Omit to return todos across all boards.
      schema: { type: integer, format: int64 }
    FilterQuery:
      name: filter
      in: query
      required: false
      description: >
        Server-side filter query. Qualifiers: `label:<name>`, `priority:<name>`,
        `date:<value>`, `has:<complete|label|priority|recur|date>`, and bare
        search text. Prepend `!` to label/priority/date/has for negation. Date
        values: week, overdue, none, today, tomorrow, YYYY-MM-DD, or
        YYYY-MM-DD..YYYY-MM-DD. Combine presets in one value with `or`/`and`,
        e.g. `date:"overdue or today"` (`and` binds tighter than `or`); only
        one `date:` qualifier per query. Invalid values yield 400.


        Sorting: add `sort:<priority|label|date>` to reorder sibling groups.
        Repeat for tiebreakers (first key wins, subsequent break ties); prefix
        `!` to reverse, e.g. `sort:!priority`. Todos missing the sorted
        attribute land last under ascending order. Sort applies after
        filtering and only reorders within a parent — the tree structure is
        preserved.
      schema: { type: string, example: "!has:complete sort:priority sort:date" }
    TodayQuery:
      name: today
      in: query
      required: false
      description: Reference date (YYYY-MM-DD) for the date presets. Defaults to the server date.
      schema: { type: string, format: date, example: "2026-08-10" }
    LabelNamePath:
      name: name
      in: path
      required: true
      description: Label name (URL-decoded path segment).
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input (malformed body, invalid id, bad recurrence, etc.).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (e.g. deleting the last board).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key (only when the server runs with `-api-key`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Key passed to the server's `-api-key` flag. Optional: when the flag is
        unset the API is open and this scheme is ignored. The key may also be
        sent as `Authorization: Bearer <key>`. Browsers don't use this scheme:
        they hold a short-lived `todo_session` cookie (see the description
        above), which the guard accepts interchangeably.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Board:
      type: object
      required: [id, name, position]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        position: { type: integer, description: 0-based index within boards. }

    CreateBoard:
      type: object
      required: [name]
      properties:
        name: { type: string }
        position:
          type: integer
          nullable: true
          description: Omit to append at the end.

    UpdateBoard:
      type: object
      description: Partial update; omitted fields are unchanged.
      properties:
        name:
          type: string
          nullable: true
        position:
          type: integer
          nullable: true

    SavedSearch:
      type: object
      required: [id, name, query]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        query: { type: string, description: "Filter grammar text applied via GET /api/todos?filter=." }

    CreateSavedSearch:
      type: object
      required: [name, query]
      properties:
        name: { type: string }
        query: { type: string, description: Must parse with the filter grammar. }

    Todo:
      type: object
      required: [id, boardId, title, description, completed, position]
      properties:
        id: { type: integer, format: int64 }
        boardId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        completed: { type: boolean }
        parentId:
          type: integer
          format: int64
          nullable: true
          description: Parent todo id; null/absent means a root todo.
        position:
          type: integer
          description: 0-based index within its sibling group, scoped to the board.
        labels:
          type: array
          items: { type: string }
        labelColors:
          type: array
          description: Per-label colour (parallel to labels; hex string, empty = auto).
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              color: { type: string, description: "Hex colour; empty means auto-assigned." }
        priority:
          type: string
          description: "Priority name; empty/absent means none."
        priorityColor:
          type: string
          description: "Hex colour for the priority; empty means auto-assigned."
        dueDate:
          type: string
          description: "YYYY-MM-DD; empty/absent means none."
        recurrence:
          allOf:
            - $ref: "#/components/schemas/Recurrence"
          description: Recurrence rule; absent means non-recurring.
        scheduleText:
          type: string
          description: Canonical free-text seed for the edit field (computed, not stored).
        recurrenceLabel:
          type: string
          description: Short badge label, e.g. "2 weeks on Mon, Wed" (computed, not stored).

    CreateTodo:
      type: object
      required: [title]
      properties:
        boardId:
          type: integer
          format: int64
          nullable: true
          description: >
            Target board. Required for top-level todos (rejected with 400
            otherwise). Optional when `parentId` is set — the new subtask
            inherits its parent's board.
        title: { type: string }
        description: { type: string }
        parentId:
          type: integer
          format: int64
          nullable: true
          description: Parent todo to nest under; null/absent creates a root todo.
        position:
          type: integer
          nullable: true
          description: 0-based index within the sibling group; omit to append.
        labels:
          type: array
          items: { type: string }
        priority:
          type: string
          description: "Priority name; empty/absent means none."
        dueDate:
          type: string
          description: "YYYY-MM-DD."
        recurrence:
          $ref: "#/components/schemas/Recurrence"

    UpdateTodo:
      type: object
      description: >
        Partial update; omitted fields are left unchanged. Four fields carry a
        three-way distinction:
          * `parentId` — absent: unchanged; null: move to root; <number>: nest under parent.
          * `priority` — absent: unchanged; null/empty: clear; <string>: set.
          * `dueDate` — absent: unchanged; null: clear; "YYYY-MM-DD": set.
          * `recurrence` — absent: unchanged; null: clear; object: set.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        completed:
          type: boolean
          nullable: true
        parentId:
          type: integer
          format: int64
          nullable: true
          description: "Tri-state: absent = unchanged; null = move to root; <n> = nest under parent n."
        position:
          type: integer
          nullable: true
        labels:
          type: array
          items: { type: string }
          nullable: true
        priority:
          type: string
          nullable: true
          description: "Absent = unchanged; null/empty = clear; <string> = set."
        dueDate:
          type: string
          nullable: true
          description: "Absent = unchanged; null = clear; \"YYYY-MM-DD\" = set."
        recurrence:
          allOf:
            - $ref: "#/components/schemas/Recurrence"
          type: object
          nullable: true
          description: Absent = unchanged; null = clear; object = set.

    MoveTodo:
      type: object
      description: >
        Reparent and/or reorder. `parentId` uses the same tri-state as UpdateTodo
        (absent = unchanged, null = root, <number> = nest under parent).
        A `boardId` other than the todo's current board moves the todo and its
        whole subtree to that board as a root todo.
      properties:
        parentId:
          type: integer
          format: int64
          nullable: true
          description: "Tri-state: absent = unchanged; null = move to root; <n> = nest under parent n."
        position:
          type: integer
          nullable: true
          description: 0-based index within the (new) sibling group; omit to append.
        boardId:
          type: integer
          format: int64
          nullable: true
          description: >
            Move the todo (with its subtree, nesting kept) to this board as a
            root todo. Absent or null = stay on the current board. Ignored when
            a parent is supplied — a subtask inherits the parent's board.

    CompleteTodo:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
          description: "true marks complete (cascades to descendants and spawns the next recurring instance); false marks incomplete."

    CompleteResponse:
      type: object
      required: [todo, todos]
      properties:
        todo:
          $ref: "#/components/schemas/Todo"
        todos:
          type: array
          items: { $ref: "#/components/schemas/Todo" }
          description: The full board tree, so the client can re-sync cascaded state.

    CreateLabel:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Label:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color:
          type: string
          description: "Hex colour (e.g. #ef4444); empty means auto-assigned palette colour."

    UpdateLabel:
      type: object
      properties:
        color:
          type: string
          nullable: true
          description: "Hex colour (e.g. #ef4444); null or empty clears the user-defined colour."

    LabelName:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Priority:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color:
          type: string
          description: "Hex colour (e.g. #ef4444); empty means auto-assigned palette colour."
        position:
          type: integer
          nullable: true
          description: "User-defined ordering (0 = first/highest); absent for ad-hoc priorities."

    CreatePriority:
      type: object
      required: [name]
      properties:
        name: { type: string }

    UpdatePriority:
      type: object
      properties:
        color:
          type: string
          nullable: true
          description: "Hex colour (e.g. #ef4444); null or empty clears the user-defined colour."

    PriorityName:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Recurrence:
      type: object
      required: [frequency, interval]
      description: |
        Todoist-style repeating schedule. Fields depend on the frequency:
          * daily   — interval only.
          * weekly  — interval; weekdays restricts to specific weekdays.
          * monthly — interval plus one of monthDays, lastDay, or nthWeekday
            (with none set, the base day-of-month is kept).
          * yearly  — interval only.
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          description: Repeat every N periods.
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: "weekly: target weekdays, 0=Sun..6=Sat."
        monthDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 31
          description: "monthly: target days-of-month (e.g. [2, 15, 27])."
        lastDay:
          type: boolean
          description: monthly — target the last day of the month.
        nthWeekday:
          allOf:
            - $ref: "#/components/schemas/NthWeekday"
          description: monthly — ordinal weekday of the month.
        endDate:
          type: string
          description: "YYYY-MM-DD; recurrence stops after this date."
        fromCompletion:
          type: boolean
          description: "Todoist's every!: advance from the completion date, not the due date."

    NthWeekday:
      type: object
      required: [n, weekday]
      description: Ordinal weekday of the month, e.g. the 2nd Tuesday (n=2, weekday=2) or the last Friday (n=-1, weekday=5).
      properties:
        n:
          type: integer
          description: "1..5, or -1 for the last such weekday."
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: "0=Sun..6=Sat."

    ScheduleParseRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Free-text due date / recurrence.
        today:
          type: string
          description: "Client's local today as YYYY-MM-DD, so relative terms like \"tomorrow\" resolve from the user's perspective."

    ScheduleParseResponse:
      type: object
      required: [ok, dueDate, scheduleText, recurrence]
      properties:
        ok:
          type: boolean
          description: Whether parsing succeeded.
        dueDate:
          type: string
          description: "YYYY-MM-DD; empty when no due date or on parse failure."
        recurrence:
          allOf:
            - $ref: "#/components/schemas/Recurrence"
          type: object
          nullable: true
          description: Parsed recurrence; null means non-recurring.
        scheduleText:
          type: string
          description: Canonical free-text rendering of the parsed schedule.
        error:
          type: string
          description: Present when ok is false.

    ScheduleExtractResponse:
      type: object
      required: [ok, title, labels]
      properties:
        ok:
          type: boolean
          description: Whether a non-empty title was produced (false for blank input or only labels).
        title:
          type: string
          description: The title with labels, priority, and the trailing schedule removed; spacing collapsed.
        labels:
          type: array
          items: { type: string }
          description: "Parsed #label names (without the leading #); empty when none."
        priority:
          type: string
          description: "Parsed @priority name (without the leading @); absent when none."
        dueDate:
          type: string
          description: "YYYY-MM-DD of the trailing schedule; absent when none."
        recurrence:
          allOf:
            - $ref: "#/components/schemas/Recurrence"
          description: Parsed recurrence of the trailing schedule; absent when non-recurring.
        scheduleText:
          type: string
          description: Canonical free-text rendering of the trailing schedule; absent when none.
