name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

concurrency:
  # One in-flight run per workflow+ref; a newer push/PR update cancels the
  # superseded run instead of running to completion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      # The SPA build produces the go:embed inputs (internal/ui/dist and the
      # gitignored internal/api/swagger-ui) that every Go step below needs;
      # vitest needs only node_modules, so the two run concurrently.
      - name: SPA build and unit tests
        working-directory: web
        run: |
          pnpm build & build=$!
          pnpm test & unit=$!
          status=0
          wait "$build" || status=1
          wait "$unit" || status=1
          exit "$status"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # The one real build of the artifact e2e drives; the vet/test step
      # below reuses its build-cache entries instead of recompiling.
      - name: Build server binary
        run: go build -o todo-e2e .
      # The browser download (~170MB) is tied to the playwright version pinned
      # in the lockfile; caching it leaves only the apt deps to install.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      # vet/test are CPU-bound while the Chromium install is network-bound, so
      # all three run concurrently; a failure in any branch fails the step.
      - name: Go vet, Go test, and Chromium install
        run: |
          go vet ./... & vet=$!
          go test ./... & gotest=$!
          (cd web && pnpm exec playwright install --with-deps chromium) & chromium=$!
          status=0
          wait "$vet" || status=1
          wait "$gotest" || status=1
          wait "$chromium" || status=1
          exit "$status"
      # E2E drives the production artifact end-to-end (real Chromium against
      # the binary built above); E2E_BIN makes playwright's globalSetup skip
      # its own go build.
      - name: E2E tests
        working-directory: web
        env:
          E2E_BIN: ${{ github.workspace }}/todo-e2e
        run: pnpm e2e
      # Traces and page snapshots from any failed e2e test, for debugging.
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7

  openapi:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Redocly validates the spec structure (bad refs, invalid schemas fail the
      # build); style warnings stay advisory. Node is preinstalled on the
      # runner, so npx needs no extra setup.
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@2 lint internal/api/openapi.yaml

  image:
    name: Build and push image
    needs: [test, openapi]
    # Only build/push on master and version tags, and only once the test job
    # above has passed (needs + success() gating). Skipped on PRs and other
    # branches.
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate Tags
        id: tags
        uses: greboid/docker-tags-action@v6.0.6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fullname: 'false'
          separator: ' '
      - name: Build Image
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            buildah build -t "ghcr.io/${{ github.repository }}:$tag" -f Containerfile .
          done
      - name: Login to Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push Images
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            buildah push "ghcr.io/${{ github.repository }}:$tag"
          done
